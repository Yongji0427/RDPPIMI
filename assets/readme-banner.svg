<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">RDPPIMI</title>
  <desc id="desc">Compound features and protein-pair representations are combined through bilinear attention for interaction modulator prediction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf4ff"/><stop offset="1" stop-color="#f5faf8"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8ca0ba" stroke-width="1.4"/></marker>
  </defs>
  <rect width="1120" height="330" rx="22" fill="url(#bg)"/>
  <circle cx="1064" cy="50" r="96" fill="#e0edf7" opacity=".55"/>
  <circle cx="15" cy="315" r="95" fill="#dceee9" opacity=".5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="72" fill="#183b68" font-size="42" font-weight="700" letter-spacing="1">RDPPIMI</text>
    <text x="50" y="103" fill="#55708d" font-size="17">Connecting compounds with the context of a protein pair</text>
    <g fill="#fff" stroke="#d5e1ee" stroke-width="1.2">
      <rect x="48" y="142" width="388" height="65" rx="12"/>
      <rect x="48" y="229" width="388" height="65" rx="12"/>
      <rect x="510" y="183" width="240" height="70" rx="12"/>
      <rect x="820" y="183" width="252" height="70" rx="12"/>
    </g>
    <rect x="48" y="142" width="5" height="65" rx="2.5" fill="#4476b5"/>
    <rect x="48" y="229" width="5" height="65" rx="2.5" fill="#438b79"/>
    <text x="72" y="169" fill="#244d7d" font-size="18" font-weight="700">Compound representation</text>
    <text x="72" y="192" fill="#60748a" font-size="14">Pretrained molecular graph features</text>
    <text x="72" y="256" fill="#276b58" font-size="18" font-weight="700">Protein-pair representation</text>
    <text x="72" y="279" fill="#60748a" font-size="14">Interface priors · Multi-scale ESM-2 features</text>
    <g fill="none" stroke="#8ca0ba" stroke-width="1.8" marker-end="url(#arrow)">
      <path d="M436 175H471V204H510"/>
      <path d="M436 262H471V233H510"/>
      <path d="M750 218H820"/>
