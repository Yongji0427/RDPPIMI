    <text x="630" y="214" text-anchor="middle" fill="#334b68" font-size="19" font-weight="700">Bilinear attention</text>
    <text x="630" y="237" text-anchor="middle" fill="#60748a" font-size="14">Joint compound–pair modeling</text>
    <text x="946" y="214" text-anchor="middle" fill="#244d7d" font-size="19" font-weight="700">Modulator prediction</text>
    <text x="946" y="237" text-anchor="middle" fill="#60748a" font-size="14">Compound–protein-pair interaction</text>
  </g>
</svg>
